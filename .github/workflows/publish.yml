name: Publish Package to npm

on:
  release:
    types: [published] # Workflow ini akan berjalan otomatis begitu Anda mengklik "Publish Release" di GitHub

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Mengambil kode terbaru dari repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan environment Node.js dan mengarahkan ke registry npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Anda bisa sesuaikan dengan versi Node.js yang digunakan
          registry-url: 'https://registry.npmjs.org'

      # 3. Menginstall dependencies secara bersih (clean install)
      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Release tag/version mismatch')"

      # 4. Validasi kualitas wajib sebelum publikasi
      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Enforce coverage thresholds
        run: npm run coverage

      - name: Verify npm package contents
        run: npm pack --dry-run

      # 5. Proses compile/build (Aktifkan baris di bawah ini jika proyek Anda menggunakan TypeScript atau bundler)
      # - name: Build package
      #   run: npm run build

      # 6. Mempublikasikan ke npm menggunakan token yang aman di GitHub Secrets
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKENS }}
